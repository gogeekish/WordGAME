<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WORD ARENA TV - Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef1f5;color:#111}
header{background:#111827;color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px}.status{font-size:13px;color:#a7f3d0}
.container{max-width:1250px;margin:auto;padding:18px}
.panel{background:white;border-radius:14px;padding:16px;margin-bottom:18px;box-shadow:0 2px 10px #0001}
h2,h3{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
label{font-weight:bold;font-size:13px;display:block;margin:8px 0 5px}
input,textarea,button{font:inherit}input,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px}textarea{min-height:70px;resize:vertical}
button{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:bold}
.primary{background:#2563eb;color:white}.green{background:#16a34a;color:white}.red{background:#dc2626;color:white}.gray{background:#64748b;color:white}.orange{background:#ea580c;color:white}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.section{border:1px solid #dbe2ea;border-radius:12px;padding:14px;margin-top:12px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin:10px 0}.item-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.showbtn{background:#0f766e;color:white}.hidebtn{background:#475569;color:white}.tiny{padding:6px 10px;font-size:12px}
.timer{font-size:46px;font-weight:900;text-align:center;margin:8px}.winner{display:flex;gap:8px;align-items:center}
@media(max-width:800px){.grid{grid-template-columns:1fr}header{position:relative}}
</style>
</head>
<body>
<header><h1>WORD ARENA TV — ADMIN</h1><div class="status" id="conn">Connecting…</div></header>
<div class="container">
<div class="panel">
<h2>Game Settings</h2>
<div class="grid">
<div><label>Game Title</label><input id="title"></div>
<div><label>Subtitle</label><input id="subtitle"></div>
<div><label>Player 1 / Team 1</label><input id="p1"></div>
<div><label>Player 2 / Team 2</label><input id="p2"></div>
</div>
<div class="controls">
<button class="primary" onclick="save()">Save Settings</button>
<button class="gray" onclick="openPublic()">Open Public Display</button>
<button class="red" onclick="gameOver()">Game Over</button>
<button class="gray" onclick="clearWinner()">Clear Winner</button>
</div>
</div>

<div class="panel">
<h2>Timer</h2>
<div class="timer" id="timer">30</div>
<div class="controls" style="justify-content:center">
<button class="green" onclick="socket.emit('timerStart')">Start</button>
<button class="orange" onclick="socket.emit('timerPause')">Pause</button>
<button class="gray" onclick="socket.emit('timerReset',30)">Reset 30s</button>
<button class="primary" onclick="socket.emit('timerAdd',15)">+15s</button>
<button class="primary" onclick="socket.emit('timerAdd',30)">+30s</button>
<button class="primary" onclick="socket.emit('timerAdd',60)">+1 min</button>
</div>
</div>

<div id="players"></div>

<div class="panel">
<h2>Corner Image</h2>
<input type="file" id="imageFile" accept="image/*">
<label>Image Name (this is the only text shown below the image)</label>
<input id="imageName" placeholder="e.g. Sponsor Logo">
<div class="controls"><button class="primary" onclick="uploadImage()">Show/Update Image</button><button class="red" onclick="clearImage()">Remove Image</button></div>
</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io(); let state;
const $=id=>document.getElementById(id);
socket.on("connect",()=>$("conn").textContent="Connected to offline LAN server");
socket.on("disconnect",()=>$("conn").textContent="Disconnected");
socket.on("state",s=>{state=s;render();});

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){
 if(!state)return;
 $("title").value=state.title;$("subtitle").value=state.subtitle;
 $("p1").value=state.players[0].name;$("p2").value=state.players[1].name;
 $("imageName").value=state.image.name||"";
 $("timer").textContent=formatTime(state.timer.remaining);
 const root=$("players");root.innerHTML="";
 state.players.forEach((p,pi)=>{
  const box=document.createElement("div");box.className="panel";
  box.innerHTML=`<h2>${esc(p.name)} — Total Score: ${p.total}</h2>`;
  p.sections.forEach((s,si)=>{
   const sec=document.createElement("div");sec.className="section";
   sec.innerHTML=`<div class="section-title"><h3>Section ${si+1}</h3><strong>Score: ${esc(s.score)}</strong></div>
   ${itemHTML(pi,si,"content","Document / Word / Content",s.content,s.showContent)}
   ${itemHTML(pi,si,"score","Mark / Score",s.score,s.showScore,"input")}
   ${itemHTML(pi,si,"question","Question",s.question,s.showQuestion)}`;
   box.appendChild(sec);
  });root.appendChild(box);
 });
}
function itemHTML(pi,si,key,label,val,shown,type="textarea"){
 const field=type==="input"?`<input id="f-${pi}-${si}-${key}" value="${esc(val)}">`:`<textarea id="f-${pi}-${si}-${key}">${esc(val)}</textarea>`;
 const visible=shown;
 return `<div class="item"><div class="item-head"><b>${label}</b>
 <button class="${visible?'hidebtn':'showbtn'} tiny" onclick="toggle(${pi},${si},'${key}')">${visible?'Hide':'Show'}</button></div>
 ${field}<div class="controls"><button class="primary tiny" onclick="saveItem(${pi},${si},'${key}')">Save</button></div></div>`;
}
function save(){state.title=$("title").value;state.subtitle=$("subtitle").value;state.players[0].name=$("p1").value||"PLAYER 1";state.players[1].name=$("p2").value||"PLAYER 2";send()}
function saveItem(pi,si,key){state.players[pi].sections[si][key]=$("f-"+pi+"-"+si+"-"+key).value;send()}
function toggle(pi,si,key){state.players[pi].sections[si]["show"+key[0].toUpperCase()+key.slice(1)]=!state.players[pi].sections[si]["show"+key[0].toUpperCase()+key.slice(1)];send()}
function send(){socket.emit("updateState",state)}
function gameOver(){state.gameOver=true;const a=state.players[0].total,b=state.players[1].total;state.winner=a>b?state.players[0].name:b>a?state.players[1].name:a===b?"DRAW":"";send()}
function clearWinner(){state.gameOver=false;state.winner="";send()}
function uploadImage(){
 const f=$("imageFile").files[0]; if(!f)return alert("Choose an image first.");
 const r=new FileReader();r.onload=()=>{state.image={data:r.result,name:$("imageName").value||f.name};send()};r.readAsDataURL(f);
}
function clearImage(){state.image={data:"",name:""};send()}
function formatTime(sec){sec=Math.max(0,Number(sec)||0);const m=Math.floor(sec/60),s=sec%60;return m?`${m}:${String(s).padStart(2,"0")}`:String(s)}
function openPublic(){window.open("/public.html","_blank")}
</script>
</body>
</html>
